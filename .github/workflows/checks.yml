# Every push and every pull request.
#
# The browser harnesses are in here deliberately. They are slower than the unit
# suite and they need a virtual display, but they are the tests that have
# actually caught things: a card rendered underneath the transport bar, a hint
# telling Linux users their password was protected by Windows DPAPI, a failover
# prompt that offered no way to say no. None of those are visible to a test
# that does not lay the interface out.
name: Checks

on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  pull_request:

# A second push to the same branch makes the first run pointless.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Suite, types and harnesses
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      # 24 because that is what Electron 44 bundles — the application's own
      # runtime — so the build toolchain and the thing being built agree.
      # 20 went end-of-life in April 2026 and stops getting security fixes;
      # 24 is supported into 2028.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # Chromium's own dependencies. ubuntu-latest carries most of them, but
      # not all, and the failure without them is Electron exiting silently
      # rather than saying what is missing.
      - name: Install the libraries Electron needs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libgtk-3-0 libnotify4 libnss3 libxss1 libxtst6 \
            libatspi2.0-0 libsecret-1-0 libasound2t64 || \
          sudo apt-get install -y --no-install-recommends \
            xvfb libgtk-3-0 libnotify4 libnss3 libxss1 libxtst6 \
            libatspi2.0-0 libsecret-1-0 libasound2

      - run: npm ci

      # Deliberately narrow: the rules of hooks and unused bindings, not
      # style. A hook called inside a condition type-checks perfectly and
      # then corrupts React's state between renders, which is exactly the
      # class of defect neither tsc nor the suite can see.
      - name: Lint
        run: npm run lint

      - name: Types
        run: npm run typecheck

      - name: Suite
        run: npm test

      # tools/verify-all.mjs supplies xvfb and --no-sandbox itself, so this
      # does not need to know how the harnesses want to be run.
      - name: Browser harnesses
        run: npm run verify:all
