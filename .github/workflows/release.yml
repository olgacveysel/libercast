# Builds everything a release needs, from a tag, and stops short of publishing.
#
# Before this existed, a LiberCast release could only be assembled by hand on
# two machines — the Windows installers on a desktop, the Linux packages
# somewhere with a Linux toolchain, because electron-builder cannot produce
# them from Windows. That made every release depend on one person being at one
# computer, and nobody else could reproduce one at all.
#
# The release is left as a draft on purpose. These builds are unsigned, and a
# draft can be deleted after a look; a published one has already been seen.
name: Release

on:
  push:
    tags: ['v*']
  # Buildable without tagging, to check the workflow itself.
  workflow_dispatch:

# Read-only by default. Only the job that creates the release gets the write
# token, and it runs no project code: it downloads artifacts, checksums them
# and calls the release API. The two jobs that *do* run project code — and
# with it every npm dependency's own code — cannot reach a token that can
# write to this repository.
permissions:
  contents: read

jobs:
  # The artifacts are named from package.json, and the release is named from
  # the tag. Nothing made those agree, so tagging v0.9.0-beta.5 without
  # bumping the manifest would publish a release full of files called
  # beta.4 — the same class of mismatch that put the wrong version on the
  # installer's agreement page for three releases.
  #
  # Seconds, and it runs before anything expensive.
  version:
    name: Tag agrees with package.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(node -p "require('./package.json').version")
          if [ "$tag" != "$manifest" ]; then
            echo "::error::tag $GITHUB_REF_NAME says $tag, package.json says $manifest"
            exit 1
          fi
          echo "both say $manifest"

  # Checks does not run on tags — it ignores them, so that tagging a commit
  # does not run the same suite twice. That leaves a tag with nothing
  # verifying it: whatever was last pushed to the branch is what gets
  # packaged, and a release built from a red commit is the one kind of build
  # nobody can take back once it is downloaded.
  #
  # So the release runs the suite itself, before spending forty minutes on
  # two packaging jobs. The harnesses are included: they are the tests that
  # catch an interface laid out wrongly, which is not something the unit
  # suite can see, and ten minutes is cheap against publishing it.
  verify:
    name: Suite, types and harnesses
    needs: [version]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install the libraries Electron needs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libgtk-3-0 libnotify4 libnss3 libxss1 libxtst6 \
            libatspi2.0-0 libsecret-1-0 libasound2t64 || \
          sudo apt-get install -y --no-install-recommends \
            xvfb libgtk-3-0 libnotify4 libnss3 libxss1 libxtst6 \
            libatspi2.0-0 libsecret-1-0 libasound2

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run verify:all

  windows:
    name: Windows installer and portable
    needs: [verify]
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # pack:win regenerates the installer notice for Windows first, which is
      # what keeps the version on the agreement page honest — it shipped the
      # wrong one for three releases because it was written by hand.
      - run: npm run pack:win
      - uses: actions/upload-artifact@v5
        with:
          name: windows
          path: |
            release/*.exe
          if-no-files-found: error

  linux:
    name: Linux AppImage and deb
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run pack:linux
      - uses: actions/upload-artifact@v5
        with:
          name: linux
          path: |
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

  # Gated per step rather than per job, deliberately. With the `if` on the
  # job, a workflow_dispatch run skipped all of this — so the one thing a
  # trial run could not check was the collecting and checksumming, which is
  # the fiddliest part and the only part with shell globbing in it. Now a
  # trial run exercises everything and stops short of creating a release.
  draft:
    name: Collect, checksum, and draft on a tag
    needs: [windows, linux]
    runs-on: ubuntu-latest
    # The only job with a token that can write to the repository.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Collect and checksum
        run: |
          mkdir -p out
          find artifacts -type f \( -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' \) \
            -exec cp {} out/ \;
          cd out
          sha256sum * > SHA256SUMS.txt
          echo "--- built ---"
          cat SHA256SUMS.txt

      - name: Draft the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: out/*
          generate_release_notes: true
          body: |
            <!--
              A draft: nothing here is public until it is published by hand.
              Replace this with the release notes, and check the artifact
              checksums against SHA256SUMS.txt before publishing.
              These builds are unsigned on every platform.
            -->
