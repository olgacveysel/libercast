appId: com.libercast.app
productName: LiberCast
copyright: Copyright © 2026 LiberCast contributors
directories:
  buildResources: resources
  output: release

# Chromium ships 55 locale files, 39 MB of them, and they are only used for the
# strings Chromium itself draws — the context menu, the spellchecker, the
# certificate warnings. LiberCast's own interface is translated separately, so
# the list here matches the languages the application offers. Keeping three
# instead of 55 saves about 37 MB installed.
electronLanguages:
  - en-US
  - tr
  - de
# Only `out/` and the production dependencies belong in the package. Everything
# listed here is either a source file, a build input, or output.
#
# Each directory is excluded twice, as the name and as its contents. The
# shorthand for that is `name{,/**/*}`, and electron-builder's own defaults use
# it — but the empty first alternative in those braces does not match on every
# platform, and when it silently fails on the output directory the result is a
# build that packs the previous build's output, so every installer is larger
# than the last. Spelled out, it cannot misfire.
# Only `out/` and the production dependencies belong in the package.
#
# IMPORTANT: this list is repeated under `win:` and `linux:`, and that
# duplication is not an oversight.
#
# A platform block's `files` does not add to this one — it REPLACES it, and
# electron-builder's own defaults with it. The two platform blocks existed to
# drop the ffprobe and better-sqlite3 binaries for platforms that are not
# being built, four lines each, and those four lines silently became the
# entire filter. Every Windows and Linux package since has carried the whole
# source tree, the test suite and the `.git` directory, and a package built on
# a working machine carried whatever else was lying in the folder — a log
# file, scratch output. The size guard never caught it because the archive was
# still only a few megabytes.
#
# So: anything that must be excluded has to appear in all three lists.
# `test/packaging.test.ts` compares them and fails if one drifts.
#
# Each directory is excluded twice, as the name and as its contents. The
# shorthand for that is `name{,/**/*}`, and electron-builder's own defaults use
# it — but the empty first alternative in those braces does not match on every
# platform, so it is spelled out here.
files:
  - '!.git'
  - '!.git/**/*'
  - '!.vscode'
  - '!.vscode/**/*'
  - '!src'
  - '!src/**/*'
  - '!test'
  - '!test/**/*'
  - '!docs'
  - '!docs/**/*'
  - '!tools'
  - '!tools/**/*'
  - '!.github'
  - '!.github/**/*'
  - '!release'
  - '!release/**/*'
  - '!Claude outputs'
  - '!Claude outputs/**/*'
  - '!asar-*.txt'
  - '!*.log'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!eslint.config.{js,mjs,cjs}'
  - '!check-credentials.mjs'
  - '!gpu-report.cjs'
  - '!{.eslintrc,.editorconfig,.gitignore,.gitattributes,README.md,FEATURES.md,THIRD-PARTY-NOTICES.md}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json,tsconfig.test.json}'
  - '!*.tsbuildinfo'
  - '!package-lock.json'
  - '!node_modules/ffprobe-static/tests/**'
  - '!node_modules/better-sqlite3/deps/**'
  - '!node_modules/better-sqlite3/src/**'
  - '!node_modules/better-sqlite3/binding.gyp'

# Fails the build if the package came out far larger than the application is,
# rather than letting an oversized installer reach someone's download folder.
afterPack: tools/after-pack.cjs

# better-sqlite3 ships Node-API prebuilds — one binary per platform, valid
# across Node and Electron versions alike, because Node-API is ABI-stable. So
# there is nothing to rebuild, and attempting it is not merely wasted work: it
# sends node-gyp to fetch Electron's headers over the network on every install
# and every package, which fails wherever that host is not reachable.
#
# This was `npmRebuild` doing its default job on a dependency that used to need
# it and no longer does.
npmRebuild: false

asarUnpack:
  # ffmpeg and ffprobe are real executables and cannot be run from inside asar.
  - resources/**
  - node_modules/ffmpeg-static/**
  - node_modules/ffprobe-static/**
  # A .node addon cannot be loaded from inside the archive — the dynamic
  # linker needs a real file. electron-builder usually spots these on its own;
  # it is stated here because "usually" is how the ffprobe exclusions went
  # wrong, and a database that will not open is not a subtle failure.
  - node_modules/better-sqlite3/**

# Put beside LiberCast.exe rather than inside the asar, because the GPL text
# has to be findable by someone who received the installer, and a licence
# buried in an archive is not.
extraFiles:
  - from: LICENSE
    to: LICENSE.txt
  - from: THIRD-PARTY-NOTICES.md
    to: THIRD-PARTY-NOTICES.md
  # The notice NSIS shows on its agreement page. A Linux package has no such
  # page, so there it ships as a file people can actually find.
  - from: resources/eula.txt
    to: NOTICE.txt
  # The GPL text is committed rather than copied out of node_modules. The
  # licence itself never varies, and ffmpeg-static names its copy after the
  # binary — ffmpeg.LICENSE on Linux but ffmpeg.exe.LICENSE on Windows — so a
  # fixed path here builds on one platform and fails on the other.
  #
  # The committed file is named for the component it covers. LiberCast's own
  # code is MIT; a bare GPL-3.0.txt sitting in the repository invites the
  # reasonable but wrong conclusion that the project is GPL.
  #
  # The source keeps the licence's own name and the destination says what it
  # covers. Naming the source `ffmpeg-GPL-3.0.txt` was the intent, but the file
  # was never renamed, so this entry quietly copied nothing for several
  # releases — harmless only because the pattern-matched entry below shipped
  # ffmpeg's own copy of the same text anyway.
  - from: resources/licenses/GPL-3.0.txt
    to: licenses/ffmpeg-GPL-3.0.txt
  # The build manifest does vary: it names the exact ffmpeg version and the
  # libraries compiled into it, which is the part that has to describe the
  # binary actually being shipped. Matched by pattern for the same naming
  # reason, and absent rather than fatal if the package did not fetch it.
  - from: node_modules/ffmpeg-static
    to: licenses
    filter:
      - 'ffmpeg*.README'
      - 'ffmpeg*.LICENSE'
win:
  # resources/icon.ico carries every size from 16px up; Windows picks the one it
  # needs, and a missing small size is what makes a taskbar icon look smeared.
  icon: resources/icon.ico
  # Everything from the top-level `files`, because a platform block replaces
  # that list rather than extending it. See the note up there.
  files:
    - '!.git'
    - '!.git/**/*'
    - '!.vscode'
    - '!.vscode/**/*'
    - '!src'
    - '!src/**/*'
    - '!test'
    - '!test/**/*'
    - '!docs'
    - '!docs/**/*'
    - '!tools'
    - '!tools/**/*'
    - '!.github'
    - '!.github/**/*'
    - '!release'
    - '!release/**/*'
    - '!Claude outputs'
    - '!Claude outputs/**/*'
    - '!asar-*.txt'
    - '!*.log'
    - '!electron.vite.config.{js,ts,mjs,cjs}'
    - '!eslint.config.{js,mjs,cjs}'
    - '!check-credentials.mjs'
    - '!gpu-report.cjs'
    - '!{.eslintrc,.editorconfig,.gitignore,.gitattributes,README.md,FEATURES.md,THIRD-PARTY-NOTICES.md}'
    - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json,tsconfig.test.json}'
    - '!*.tsbuildinfo'
    - '!package-lock.json'
    - '!node_modules/ffprobe-static/tests/**'
    - '!node_modules/better-sqlite3/deps/**'
    - '!node_modules/better-sqlite3/src/**'
    - '!node_modules/better-sqlite3/binding.gyp'

    # ffprobe-static ships a binary for every platform it supports — around
    # 336 MB of them, of which a Windows x64 build needs 61 MB. Scoped to the
    # Windows build so a build for anything else still gets its own ffprobe.
    - '!node_modules/ffprobe-static/bin/{darwin,linux}/**'
    - '!node_modules/ffprobe-static/bin/win32/ia32/**'
    # Same reasoning for the database addon: eight platforms' prebuilds ship
    # in the package, of which one is ever loaded.
    #
    # Named one by one rather than excluding the directory and adding one
    # back. A re-include after a wildcard exclusion does not survive here —
    # it produced a package with no prebuilds at all, which is an application
    # that starts and then cannot open its database.
    - '!node_modules/better-sqlite3/prebuilds/{darwin,linux,linuxmusl}-*'
    - '!node_modules/better-sqlite3/prebuilds/win32-arm64.node'
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  artifactName: ${productName}-${version}-setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: LiberCast
  uninstallDisplayName: LiberCast ${version}
  # The agreement page. A beta notice rather than a formal EULA: it says the
  # software is unfinished, that LiberCast supplies no channels and the person
  # installing is responsible for what they play, that nothing is sent
  # anywhere, and that the bundled ffmpeg is under a different licence.
  license: resources/eula.txt
portable:
  artifactName: ${productName}-${version}-portable.${ext}

linux:
  icon: resources/icon.png
  # Required by the deb target. The GitHub noreply address rather than a
  # personal or work one: this string is embedded in a package that anyone can
  # download and read.
  maintainer: Veysel Olgac <olgacveysel@users.noreply.github.com>
  # electron-builder writes this straight into the desktop entry's Categories,
  # and it overwrites anything the `desktop` map below says, so the full list
  # belongs here rather than there. AudioVideo is the required main category;
  # the rest are what a desktop's menu editor sorts on.
  category: AudioVideo;Video;Player;TV
  # Shown in the application menu under the name people will look for.
  #
  # `Comment` is deliberately absent: electron-builder fills it from
  # package.json's `description` and overwrites anything stated here, so a line
  # in this map would look like the source of truth while having no effect.
  # That description is what the menu shows, which is why it no longer names a
  # single platform — it used to say "for Windows", on a Linux desktop.
  #
  # electron-builder 25 nested these under `entry`; a flat map is now a schema
  # error rather than something silently ignored, which is the better failure.
  desktop:
    entry:
      Name: LiberCast
      GenericName: IPTV Player
      Keywords: iptv;m3u;xtream;tv;stream;
  # Repeated from the top-level `files` for the reason given there.
  files:
    - '!.git'
    - '!.git/**/*'
    - '!.vscode'
    - '!.vscode/**/*'
    - '!src'
    - '!src/**/*'
    - '!test'
    - '!test/**/*'
    - '!docs'
    - '!docs/**/*'
    - '!tools'
    - '!tools/**/*'
    - '!.github'
    - '!.github/**/*'
    - '!release'
    - '!release/**/*'
    - '!Claude outputs'
    - '!Claude outputs/**/*'
    - '!asar-*.txt'
    - '!*.log'
    - '!electron.vite.config.{js,ts,mjs,cjs}'
    - '!eslint.config.{js,mjs,cjs}'
    - '!check-credentials.mjs'
    - '!gpu-report.cjs'
    - '!{.eslintrc,.editorconfig,.gitignore,.gitattributes,README.md,FEATURES.md,THIRD-PARTY-NOTICES.md}'
    - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json,tsconfig.test.json}'
    - '!*.tsbuildinfo'
    - '!package-lock.json'
    - '!node_modules/ffprobe-static/tests/**'
    - '!node_modules/better-sqlite3/deps/**'
    - '!node_modules/better-sqlite3/src/**'
    - '!node_modules/better-sqlite3/binding.gyp'

    # Same reasoning as the Windows build: ffprobe-static ships a binary for
    # every platform it supports and a Linux x64 build needs one of them.
    - '!node_modules/ffprobe-static/bin/{darwin,win32}/**'
    - '!node_modules/ffprobe-static/bin/linux/ia32/**'
    # glibc, not musl: these packages target ordinary desktop distributions.
    # Named one by one, for the reason given in the Windows block.
    - '!node_modules/better-sqlite3/prebuilds/{darwin,win32,linuxmusl}-*'
    - '!node_modules/better-sqlite3/prebuilds/linux-arm64.node'
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  artifactName: ${productName}-${version}-${arch}.${ext}
deb:
  # ffmpeg is bundled, so the only dependencies are what Electron itself needs
  # on a desktop that might not have them.
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libsecret-1-0
# Squashfs inside an AppImage defaults to a light compression, which left the
# Linux build 40 MB larger than the Windows one from the same two ffmpeg
# binaries. Maximum costs build time, which is paid once, rather than download
# size, which is paid by everyone.
compression: maximum

# electron-builder writes update metadata for each target and needs a publish
# provider to name the channel. There is none here on purpose (see below), and
# without one the deb target fails after the package is already built — so the
# metadata is switched off rather than half-configured.
publish: null

# No publish target is configured on purpose: a placeholder owner makes
# `electron-builder --publish` upload to a repository that does not exist, and
# fail late. Add this block once the repository is real:
#
# publish:
#   provider: github
#   owner: <your github user or org>
#   repo: libercast
