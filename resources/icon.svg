<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024"
     role="img" aria-label="LiberCast" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>LiberCast</title>

  <!--
    The mark: a folded bird whose tail sweeps into a play arrow.

    Traced from the supplied artwork rather than redrawn by eye, so the facets
    are the designer's own. The gaps between them are holes in a single path,
    which is why this needs fill-rule="evenodd" — and why whatever sits behind
    the icon shows through them.

    No tile: the mark stands on its own against the desktop. Used at 48px and
    up; below that the gaps are thinner than a pixel and the shape greys out,
    so resources/icon-small.svg carries a solid version for the three smallest
    entries in the .ico.
  -->

  <defs>
    <!--
      The artwork's hue, with the range pulled toward the middle.

      The icon has no tile, so it sits directly on whatever is behind it — a
      dark taskbar, a light one, a photograph. At the artwork's own range the
      dark end (#2a5f69) disappears into a dark taskbar at 16px. These stops
      hold up on all three.
    -->
    <linearGradient id="mark" x1="0.05" y1="0.95" x2="0.95" y2="0.05">
      <stop offset="0" stop-color="#2f8f84"/>
      <stop offset="0.5" stop-color="#46b096"/>
      <stop offset="1" stop-color="#78dcb8"/>
    </linearGradient>
  </defs>

